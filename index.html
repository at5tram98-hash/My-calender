  scroll-behavior:auto;

.content.month.month-expanded{overflow-y:scroll!important;overscroll-behavior-y:auto}
.content.month.pinching{overflow-y:hidden!important;touch-action:none!important}
.content.month.month-list-mode{overflow:hidden!important;touch-action:auto}
.month-grid{
  --month-row-min:80px;

  grid-template-columns:repeat(7,minmax(0,1fr));

/* ===== canonical interaction/layout rules: rows, values, day events, editor picker ===== */
/* One authoritative definition for editor/detail rows and every right-side value. */
.row{
  min-height:47px;
  display:grid;
  grid-template-columns:minmax(128px,1fr) minmax(0,auto);
  align-items:center;
  column-gap:10px;
  padding:0 14px;
  border-top:.5px solid var(--hairline);
  font-size:16.5px;
  min-width:0;
}
.row:first-child{border-top:0}
.row > span:first-child,.row > label:first-child{
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.row .value,.detail-row-value,.picker-value,
.row select,.row input.value{
  min-width:0;
  max-width:240px;
  color:var(--secondary);
  text-align:right;
  justify-self:end;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1.25;
  font-variant-numeric:tabular-nums;
}
.detail-row-value{display:block;width:100%;max-width:240px}
.row input:not([type="color"]),.row select,.row textarea{
  background:transparent!important;
  border:0;
  outline:0;
  color:var(--text)!important;
  -webkit-text-fill-color:var(--text);
}
.row input.value{
  background:transparent!important;
  color:var(--secondary)!important;
  -webkit-text-fill-color:var(--secondary);
  width:min(240px,100%);
}
.row select,.row input[type=time],.row input[type=date]{
  font-size:16px;
  color:var(--secondary)!important;
  -webkit-text-fill-color:var(--secondary);
  text-align-last:right;
  max-width:240px;
}
.row textarea{
  grid-column:1/-1;
  width:100%;
  min-height:118px;
  padding:12px 0 14px;
  line-height:1.35;
  resize:vertical;
}
.row input::placeholder,.title-group input::placeholder,.row textarea::placeholder{color:var(--secondary);opacity:.72}
.picker-value{
  min-height:40px;
  display:inline-flex;
  align-items:center;
  justify-content:flex-end;
  gap:4px;
  padding:0;
  border-radius:8px;
  font-size:16px;
}
.picker-value:active{opacity:.48}
.picker-value.time{min-width:64px;max-width:74px}
.row-value-group{display:flex;align-items:center;justify-content:flex-end;gap:12px;min-width:0;max-width:250px;justify-self:end}
.row[hidden]{display:none!important}

/* One authoritative definition for timed event blocks. */
.event-block{
  position:absolute;
  right:auto;
  left:calc(2px + (100% - 4px) * var(--lane,0) / var(--lanes,1));
  width:calc((100% - 4px) / var(--lanes,1) - 2px);
  min-height:27px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:flex-start;
  border-radius:4.5px;
  padding:2px 4px 2px 5px;
  border-left:2.5px solid var(--c);
  background:color-mix(in srgb,var(--c) 14%,var(--surface));
  box-shadow:none;
  overflow:hidden;
  text-align:left;
  color:var(--text);
  z-index:2;
  touch-action:none;
}
.event-block .event-copy{display:block;width:100%;min-width:0;overflow:hidden}
.event-block strong{
  display:block;
  width:100%;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

function openAddCalendar(){showSheet('カレンダーを追加',`<div class="form-group title-group"><input id="newCalName" placeholder="カレンダー名"></div><div class="form-group"><div class="row"><span>色</span><input id="newCalColor" type="color" value="#007aff"></div><div class="row"><span>アカウント</span><select id="newCalAccount"><option>iCloud</option><option>Gmail</option><option>その他</option></select></div></div>`,{primary:{label:'追加',disabled:true}});const name=$('#newCalName'),primary=$('#sheetPrimary');const update=()=>{const ok=!!name.value.trim();primary.disabled=!ok;primary.style.opacity=ok?1:.35;primary.onclick=ok?()=>{state.calendars.push({id:`calendar-${uid()}`,account:$('#newCalAccount').value,name:name.value.trim(),color:$('#newCalColor').value,visible:true,chipStyle:'fill'});save();render();openCalendars();toast('カレンダーを追加しました')}:null};name.oninput=update;update();setTimeout(()=>name.focus(),220)}
function openSettings(){showSheet('設定',`<div class="calendar-section-title">表示</div><div class="form-group"><div class="row"><span>週の開始曜日</span><select id="weekStart"><option value="0">日曜日</option><option value="1">月曜日</option><option value="6">土曜日</option></select></div><div class="row"><span>時間帯</span><select id="tz">${timezoneOptions(state.timezone)}</select></div><div class="row"><span>新規予定の継続時間</span><select id="dur"><option value="30">30分</option><option value="60">1時間</option><option value="90">1時間30分</option><option value="120">2時間</option></select></div></div><div class="hint">iPhoneではこれらは「設定 ＞ アプリ ＞ カレンダー」で変更します。このWebアプリではここから変更できます。</div>`,{primary:{label:'完了',disabled:false,run:()=>{state.weekStart=+$('select#weekStart').value;state.timezone=$('#tz').value;state.defaultDuration=+$('#dur').value;save();closeSheet();render()}}});$('#weekStart').value=String(state.weekStart);$('#dur').value=String(state.defaultDuration)}
function openInbox(){showSheet('出席依頼',state.invitations.length?state.invitations.map(i=>`<div class="form-group" style="padding:14px"><strong style="font-size:18px">${esc(i.title)}</strong><div style="color:var(--secondary);margin:5px 0 14px">${esc(i.from)}<br>${esc(i.date)} ${fmt(i.start)}–${fmt(i.end)}</div><div class="seg" style="grid-template-columns:repeat(3,1fr);margin:0"><button data-inv="${i.id}" data-st="declined">欠席</button><button data-inv="${i.id}" data-st="tentative">仮承諾</button><button data-inv="${i.id}" data-st="accepted">出席</button></div></div>`).join(''):'<div class="empty">新しい出席依頼はありません</div>',{primary:{label:'完了',disabled:false,run:closeSheet}});$$('[data-inv]').forEach(b=>b.onclick=()=>{const i=state.invitations.find(x=>x.id===b.dataset.inv);i.status=b.dataset.st;if(i.status==='accepted'&&!state.events.some(e=>e.invitationId===i.id))state.events.push({id:uid(),invitationId:i.id,type:'event',title:i.title,date:i.date,start:i.start,end:i.end,calendarId:'gmail',location:'',repeat:'しない',alert:'なし',timezone:state.timezone,notes:`招待元: ${i.from}`});save();closeSheet();render();toast('返信を保存しました')})}
$('#app').addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea,[contenteditable="true"]'))e.preventDefault()});
$('#viewBtn').onclick=openViewMenu;$('#searchBtn').onclick=openSearch;$('#addBtn').onclick=()=>openEditor();$('#todayBtn').onclick=()=>{state.cursor=key(today);state.selected=key(today);if(state.view==='year')state.view='month';save();render();vibrate()};$('#calendarsBtn').onclick=openCalendars;$('#inboxBtn').onclick=openInbox;$('#backBtn').onclick=()=>{const d=parse(state.cursor);if(state.view==='month'){state.view='year'}else if(state.view==='day'){state.view='month'}else if(state.view==='list'){if(state.listOrigin==='month')state.view='year';else state.view='day'}else{state.cursor=key(new Date(d.getFullYear()-1,d.getMonth(),1))}save();render()};$('#sheetCancel').onclick=closeSheet;$('#scrim').onclick=closeSheet;document.addEventListener('pointerdown',e=>{if(!e.target.closest('#viewPopover,#viewBtn'))$('#viewPopover').classList.remove('show')});
let swipe=null;const touchPointers=new Set();
$('#content').addEventListener('pointerdown',e=>{const c=$('#content');if(e.pointerType==='touch'){touchPointers.add(e.pointerId);if(touchPointers.size>1){swipe=null;return}}if(e.target.closest('button,input,select,textarea,[data-drag]'))return;swipe={x:e.clientX,y:e.clientY,scrollTop:c.scrollTop,axis:null,cancelled:false}});
$('#content').addEventListener('pointermove',e=>{if(!swipe)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;if(!swipe.axis&&Math.hypot(dx,dy)>10)swipe.axis=Math.abs(dx)>Math.abs(dy)*1.25?'x':'y';if(swipe.axis==='y'&&Math.abs($('#content').scrollTop-swipe.scrollTop)>2)swipe.cancelled=true});
$('#content').addEventListener('pointerup',e=>{if(e.pointerType==='touch'){touchPointers.delete(e.pointerId)}if(!swipe)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y,axis=swipe.axis,cancelled=swipe.cancelled;swipe=null;if(cancelled||axis!=='x'||Math.abs(dx)<64||Math.abs(dx)<Math.abs(dy)*1.45)return;const dir=dx<0?1:-1,d=parse(state.cursor),c=$('#content');const apply=()=>{if(state.view==='month')state.cursor=key(new Date(d.getFullYear(),d.getMonth()+dir,1));else if(state.view==='day')state.cursor=key(add(d,dir*(state.dayStyle==='multi'?2:1)));else if(state.view==='year')state.cursor=key(new Date(d.getFullYear()+dir,d.getMonth(),1));else return;state.selected=state.cursor;save();render();vibrate(5);c.animate?.([{opacity:.84,transform:`translateX(${-dir*14}px)`},{opacity:1,transform:'translateX(0)'}],{duration:165,easing:'cubic-bezier(.25,.1,.25,1)'})};if(c.animate){const a=c.animate([{opacity:1,transform:'translateX(0)'},{opacity:.84,transform:`translateX(${-dir*14}px)`}],{duration:100,easing:'cubic-bezier(.4,0,1,1)'});a.onfinish=apply}else apply()});
$('#content').addEventListener('pointercancel',e=>{if(e.pointerType==='touch'){touchPointers.delete(e.pointerId)}swipe=null});
let pinch=null;
function applyMonthLiveZoom(level){const grid=$('.month-grid');if(!grid)return;const row=interpStep(MONTH_ROW_STEPS,level);grid.classList.add('pinch-live');grid.style.setProperty('--month-row-min',`${row}px`)}
function applyDayLivePpm(ppm,p){const scroller=$('.time-scroll'),grid=$('.time-grid');if(!scroller||!grid)return;grid.style.height=`${1440*ppm}px`;$$('[data-minute]',grid).forEach(el=>el.style.top=`${(+el.dataset.minute)*ppm}px`);$$('.event-block[data-start]',grid).forEach(el=>{const start=+el.dataset.start,duration=+el.dataset.duration;el.style.top=`${start*ppm}px`;el.style.height=`${Math.max(27,duration*ppm)}px`;el.classList.toggle('short',Math.max(27,duration*ppm)<34)});$$('[data-now-minute]',grid).forEach(el=>el.style.top=`${(+el.dataset.nowMinute)*ppm}px`);if(p&&Number.isFinite(p.anchorMinute)){const max=Math.max(0,scroller.scrollHeight-scroller.clientHeight);scroller.scrollTop=clamp(p.anchorMinute*ppm-p.centerY,0,max)}}
function animateNumber(from,to,duration,step,done){if(matchMedia?.('(prefers-reduced-motion: reduce)').matches){step(to);done?.();return}const t0=performance.now();const tick=now=>{const x=clamp((now-t0)/duration,0,1),e=1-Math.pow(1-x,3);step(from+(to-from)*e);if(x<1)requestAnimationFrame(tick);else done?.()};requestAnimationFrame(tick)}
function finishPinch(p){if(!p)return;const c=$('#content');c.classList.remove('pinching');if(p.mode==='month'){
 const live=p.liveLevel??p.startLevel;
 if(live>4.48){state.monthZoom=4;state.monthStyle='detail';state.view='day';state.dayStyle='single';state.cursor=state.selected;save();render();vibrate(6);return}
 if(live<-.48){state.monthZoom=0;state.monthStyle='compact';state.view='year';save();render();vibrate(6);return}
 const snap=clamp(Math.round(live),0,4),fromRow=interpStep(MONTH_ROW_STEPS,clamp(live,0,4)),toRow=MONTH_ROW_STEPS[snap],grid=$('.month-grid');
 animateNumber(fromRow,toRow,180,v=>grid?.style.setProperty('--month-row-min',`${v}px`),()=>{state.monthZoom=snap;state.monthStyle=snap===0?'compact':snap===1?'stacked':'detail';save();render()});vibrate(5);return
 }
 if(p.mode==='day'){
  const live=p.liveLevel??p.startLevel;if(live<-.52){state.view='month';state.monthStyle='detail';state.monthZoom=4;save();render();vibrate(6);return}
  const snap=clamp(Math.round(live),0,4),from=interpStep(DAY_PPM_STEPS,clamp(live,0,4)),to=DAY_PPM_STEPS[snap];animateNumber(from,to,180,v=>applyDayLivePpm(v,p),()=>{state.dayZoom=snap;save();render()});vibrate(5);return
 }
 if(p.mode==='year'){
  if((p.liveLevel??0)>.35){state.view='month';state.monthStyle='compact';state.monthZoom=0;save();render();vibrate(6)}
 }
}
$('#content').addEventListener('touchstart',e=>{if(e.touches.length!==2)return;const a=e.touches[0],b=e.touches[1],dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);swipe=null;const mode=state.view==='month'?'month':state.view==='day'?'day':state.view==='year'?'year':null;if(!mode)return;const p={mode,startDist:dist,startLevel:mode==='month'?(state.monthZoom??2):mode==='day'?(state.dayZoom??1):0,liveLevel:mode==='year'?0:(mode==='month'?(state.monthZoom??2):(state.dayZoom??1))};if(mode==='day'){const scroller=$('.time-scroll'),r=scroller?.getBoundingClientRect();if(scroller&&r){p.centerY=(a.clientY+b.clientY)/2-r.top;p.anchorMinute=(scroller.scrollTop+p.centerY)/currentDayPpm()}}pinch=p;$('#content').classList.add('pinching');if(mode==='month')$('.month-grid')?.classList.add('pinch-live')},{passive:true});
const endPinch=e=>{if(!e.touches||e.touches.length<2){const p=pinch;pinch=null;if(p)finishPinch(p);else $('#content').classList.remove('pinching')}};
$('#content').addEventListener('touchend',endPinch,{passive:true});$('#content').addEventListener('touchcancel',()=>{const p=pinch;pinch=null;if(p)finishPinch(p);else $('#content').classList.remove('pinching')},{passive:true});window.addEventListener('touchend',endPinch,{passive:true});window.addEventListener('touchcancel',()=>{const p=pinch;pinch=null;if(p)finishPinch(p)},{passive:true});
$('#content').addEventListener('touchmove',e=>{if(e.touches.length!==2||!pinch)return;e.preventDefault();const a=e.touches[0],b=e.touches[1],dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),ratio=Math.log(dist/pinch.startDist);if(pinch.mode==='month'){pinch.liveLevel=clamp(pinch.startLevel+ratio/.24,-.7,4.7);applyMonthLiveZoom(pinch.liveLevel)}else if(pinch.mode==='day'){pinch.liveLevel=clamp(pinch.startLevel+ratio/.24,-.7,4.25);const ppm=interpStep(DAY_PPM_STEPS,clamp(pinch.liveLevel,0,4));applyDayLivePpm(ppm,pinch)}else if(pinch.mode==='year'){pinch.liveLevel=ratio/.24}},{passive:false});render();
})();
